<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exhibitions — Xano Armenter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="wordmark">Xano Armenter</a>
      <nav class="main-nav" aria-label="Primary">
        <button class="nav-toggle" aria-label="Toggle menu">Menu</button>
        <ul>
          <li><a href="artwork.html">Artwork</a></li>
          <li><a href="graphic-design.html">Graphic Design</a></li>
          <li><a href="sculpture.html">Sculpture</a></li>
          <li><a href="exhibitions.html">Exhibitions</a></li>
          <li><a href="bio.html">Bio</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="section container">
        <div class="page-title">
          <span class="eyebrow muted">Exhibitions</span>
          <h1 style="margin-top: 16px;">Selected shows</h1>
        </div>
        <table class="exhibitions-table" aria-label="Exhibition history">
          <thead>
            <tr>
              <th style="width: 90px;">Year</th>
              <th>Title</th>
              <th>Venue</th>
              <th>City</th>
              <th style="width: 100px;">Type</th>
            </tr>
          </thead>
          <tbody id="ex-body"></tbody>
        </table>
      </section>
    </main>
    <footer class="site-footer">
      <div>© <span id="year"></span> Xano Armenter</div>
      <div><a href="contact.html">Contact</a></div>
    </footer>
    <script src="js/data.js"></script>
    <script src="js/site.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      const body = document.getElementById("ex-body");
      EXHIBITIONS.forEach((e) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${e.year}</td>
          <td><em>${e.title}</em></td>
          <td>${e.venue}</td>
          <td>${e.city}</td>
          <td class="muted">${e.type}</td>
        `;
        body.appendChild(tr);
      });
    </script>
  </body>
</html>
