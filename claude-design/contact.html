<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact — Xano Armenter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=20260822a" />
  </head>
  <body>
    <header class="site-header">
      <a href="index.html" class="wordmark">Xano Armenter</a>
      <nav class="main-nav" aria-label="Primary">
        <button class="nav-toggle" aria-label="Toggle menu">Menu</button>
        <ul>
          <li><a href="work.html">Work</a></li>
          <li><a href="exhibitions.html">Exhibitions</a></li>
          <li><a href="bio.html">Bio</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="section container">
        <div class="page-title">
          <span class="eyebrow muted">Contact</span>
          <h1 style="margin-top: 16px;">Studio and representation</h1>
        </div>
        <div class="contact-grid">
          <div class="contact-block"><h3>Studio</h3><p id="studio-email"></p><p id="studio-address" class="muted"></p></div>
          <div class="contact-block"><h3>Representation</h3><div id="reps"></div></div>
          <div class="contact-block"><h3>Elsewhere</h3><div id="social"></div></div>
          <div class="contact-block"><h3>Press & inquiries</h3><p class="muted">For press, commissions, and studio visits, email the studio address. Please allow up to two weeks for a reply.</p></div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div>© <span id="year"></span> Xano Armenter</div>
      <div><a href="bio.html">Bio</a></div>
    </footer>
    <script src="js/data.js?v=20260822a"></script>
    <script src="js/site.js?v=20260822a"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
      document.getElementById("studio-email").innerHTML = `<a href="mailto:${CONTACT.email}">${CONTACT.email}</a>`;
      document.getElementById("studio-address").textContent = CONTACT.studio;
      const reps = document.getElementById("reps");
      CONTACT.representation.forEach((r) => {
        const p = document.createElement("p");
        p.innerHTML = `${r.gallery}, ${r.city} — <a href="mailto:${r.email}">${r.email}</a>`;
        reps.appendChild(p);
      });
      const social = document.getElementById("social");
      CONTACT.social.forEach((s) => {
        const p = document.createElement("p");
        p.innerHTML = `<a href="${s.url}" target="_blank" rel="noopener">${s.label} →</a>`;
        social.appendChild(p);
      });
    </script>
  </body>
</html>
